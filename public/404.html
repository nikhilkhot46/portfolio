<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#05060a" />
    <title>Page not found — Nikhil Khot</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 50% -100px, rgba(139, 92, 246, 0.18), transparent 60%),
          radial-gradient(900px 500px at 90% 10%, rgba(34, 211, 238, 0.12), transparent 60%),
          #05060a;
        color: #ffffff;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        overflow: hidden;
        position: relative;
      }
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.05) 1px, transparent 0);
        background-size: 32px 32px;
        mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        pointer-events: none;
      }
      .wrap {
        position: relative;
        text-align: center;
        max-width: 560px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.85rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
        backdrop-filter: blur(12px);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.6);
      }
      h1 {
        margin: 1.5rem 0 0;
        font-family: 'Space Grotesk', Inter, sans-serif;
        font-size: clamp(4rem, 16vw, 9rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        background: linear-gradient(120deg, #22d3ee 0%, #8b5cf6 55%, #fb7185 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h2 {
        margin: 0.75rem 0 0;
        font-family: 'Space Grotesk', Inter, sans-serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.92);
      }
      p {
        margin: 1rem auto 0;
        max-width: 420px;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.6;
      }
      .actions {
        margin-top: 2rem;
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1.15rem;
        border-radius: 999px;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .primary {
        background: #ffffff;
        color: #05060a;
      }
      .primary:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-1px);
      }
      .ghost {
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.9);
      }
      .ghost:hover {
        border-color: rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <span class="chip">Error 404</span>
      <h1>404</h1>
      <h2>This page wandered off.</h2>
      <p>
        The link you followed is broken, or the page has moved. Let's get you back to somewhere useful.
      </p>
      <div class="actions">
        <a class="primary" href="/">← Back to home</a>
        <a class="ghost" href="/#contact">Contact me</a>
      </div>
    </div>
  </body>
</html>
